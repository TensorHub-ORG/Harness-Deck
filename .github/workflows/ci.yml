name: Harness-Deck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build all workspace packages
        run: pnpm build

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run MCP role-scoping smoke tests
        run: pnpm smoke:mcp

      - name: Run end-to-end Harness-Deck doctor
        run: pnpm deck doctor

      - name: Build portable distribution bundle
        run: pnpm pack:bundle
